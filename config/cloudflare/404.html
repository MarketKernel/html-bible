<!doctype html>
<!-- Cloudflare Pages serves this with status 404 for a path it does not have.
     Without it Pages answers every unknown path with index.html and 200, so a
     missing data/ file would reach the page as HTML instead of "Download
     failed: 404". The app routes by #hash, so it needs no such fallback. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:3rem 1rem;text-align:center;color:#333;background:#fff}</style>
<p>Not found. · Не найдено.</p>
<p><a href="/">Bible · Библия</a></p>
</html>
