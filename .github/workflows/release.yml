name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: |
          cp build/html-bible.html "html-bible-$GITHUB_REF_NAME.html"
          sha256sum html-bible-*.html > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            html-bible-*.html
            SHA256SUMS.txt
